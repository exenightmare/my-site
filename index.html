<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightmare - Portfolio</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 40px 20px; text-align: center; }
    h1 { color: #a3e635; }
    section { max-width: 600px; margin: 30px auto; background: #1e293b; padding: 20px; border-radius: 12px; }
    button { background: #a3e635; border: none; padding: 10px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    input { padding: 10px; border-radius: 8px; border: none; font-size: 16px; width: 120px; }
    #message { margin-top: 15px; font-size: 18px; min-height: 26px; }
  </style>
</head>
<body>

  <h1>Hi, I'm Nightmare</h1>
  <p>Gaming, Android ar ethical hacking-e shikhchi.</p>

  <section>
    <h2>Skills</h2>
    <p>Python, PowerShell, Linux, Git, ADB</p>
  </section>

  <section>
    <h2>Number Guessing Game</h2>
    <p>1 theke 10-er moddhe ekta number guess korun.</p>
    <input type="number" id="guess" min="1" max="10">
    <button onclick="checkGuess()">Guess</button>
    <div id="message"></div>
  </section>

  <script>
    const secret = Math.floor(Math.random() * 10) + 1;
    let tries = 0;

    function checkGuess() {
      const value = Number(document.getElementById("guess").value);
      const msg = document.getElementById("message");
      tries++;

      if (value === secret) {
        msg.textContent = `Shabash! ${tries} bare-e thik korechen.`;
      } else if (value < secret) {
        msg.textContent = "Ektu boro number din.";
      } else {
        msg.textContent = "Ektu chhoto number din.";
      }
    }
  </script>

</body>
</html>
